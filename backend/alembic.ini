[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# The database URL is supplied by migrations/env.py from KMR_MIGRATION_DATABASE_URL.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
