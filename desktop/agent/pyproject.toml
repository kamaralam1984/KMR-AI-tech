[project]
name = "kmr-desktop"
version = "0.1.0"
description = "KMR AI desktop assistant: the local agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
windows = ["uiautomation>=2.0"]

[tool.setuptools.packages.find]
include = ["kmr_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
